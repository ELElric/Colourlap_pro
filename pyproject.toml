[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorlab-pro"
version = "1.1.0"
description = "Professional spectral data management and gamut analysis tool for the display industry."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "ColorLab Pro Team" }
]
keywords = ["display", "spectral", "gamut", "color-science", "ciexyz", "cie1931"]

dependencies = [
    "PySide6>=6.6,<6.13",
    "pywebview>=5.0",
    "numpy>=1.26,<2.3",
    "colour-science>=0.4.4,<0.5",
    "SQLAlchemy>=2.0,<2.1",
    "shapely>=2.0,<2.2",
    "loguru>=0.7,<0.8",
    "scipy>=1.11,<1.18",
    "openpyxl>=3.1,<3.2",
    "pyyaml>=6.0,<6.1",
    "matplotlib>=3.7,<3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
colorlab-pro = "colorlab_pro.cli:main"
colorlab-pro-gui = "colorlab_pro.ui.app_pywebview:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"colorlab_pro.ui" = ["**/*.qss", "**/*.ui", "**/*.html", "**/*.js"]
"colorlab_pro.resources" = ["**/*"]

# --- Ruff (merged from ruff.toml) ---

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "Q"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function call in default argument (common in Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"tests/unit/ui/test_spectrum_page.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- pytest (merged from pytest.ini) ---

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require DB / filesystem)",
    "ui: UI tests (require display)",
    "slow: Slow tests (skip on default run)",
]
filterwarnings = [
    "ignore::DeprecationWarning:colour..*",
]

# --- mypy (merged from mypy.ini) ---

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["colour.*", "shapely.*", "PySide6.*", "sqlalchemy.*", "scipy.*", "openpyxl.*"]
ignore_missing_imports = true

# --- Coverage ---

[tool.coverage.run]
source = ["src/colorlab_pro"]
omit = [
    "src/colorlab_pro/ui/*",
    "src/colorlab_pro/cli.py",
    "src/colorlab_pro/database/migrations.py",
    "src/colorlab_pro/exporters/report_exporter.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.paths]
source = [
    "src/colorlab_pro",
]
